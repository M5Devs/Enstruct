[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enstruct"
version = "0.1.0"
description = "A professional toolkit for wrapping OpenAI's Whisper model (via faster-whisper) to transcribe, translate, and structure audio files."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "AGPL v3"}
authors = [
    {name = "M5Devs"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "faster-whisper>=1.0.0",
    "click>=8.0.0",
    "tqdm>=4.0.0",
    "gradio>=4.0.0",
    "ffmpeg-python>=0.2.0",
    "yt-dlp>=2024.1.0"
]

[project.urls]
Homepage = "https://github.com/M5Devs/Enstruct"

[project.scripts]
enstruct = "interfaces.cli.main:cli"
